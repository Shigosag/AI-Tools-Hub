version: '3.9'

services:
  client:
    build: ./client
    ports:
      - '3000:3000'

  server:
    build: ./server
    ports:
      - '5000:5000'
    env_file:
      - .env

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aitoolshub
    ports:
      - '5432:5432'